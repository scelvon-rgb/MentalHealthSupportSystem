{% extends "accounts/dashboard/base_dashboard.html" %}

{% block page_title %}
Edit Mood
{% endblock %}

{% block content %}

<div class="container">

    <h2>Edit Mood Record</h2>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-primary">
            Update Mood
        </button>

        <a href="{% url 'mood_history' %}" class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
